apiVersion: v1
kind: Pod
metadata:
  name: postgres-microservice-pod
spec:
  initContainers:
    - name: init-zookeeper
      image: busybox
      command: ['sh', '-c', 'until nc -z zookeeper 2181; do sleep 1; done']
    - name: init-kafka
      image: busybox
      command: ['sh', '-c', 'until nc -z kafka 9093; do sleep 1; done']
containers:
    - name: zookeeper
      image: wurstmeister/zookeeper:latest
      ports:
        - containerPort: 2181
      env:
        - name: MINIKUBE_IP
          value: "192.168.49.2"
        - name: ZOOKEEPER_TICK_TIME
          value: "2000"
    - name: kafka
      image: wurstmeister/kafka:latest
      ports:
        - containerPort: 9093
      env:
        - name: KAFKA_BROKER_ID
          value: "1"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://kafka:9093,PLAINTEXT_HOST://localhost:9092"
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: "PLAINTEXT"
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: "zookeeper:2181"
        - name: KAFKA_LISTENERS
          value: "PLAINTEXT://kafka:9093,PLAINTEXT_HOST://0.0.0.0:9092"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
        - name: MINIKUBE_IP
          value: "192.168.49.2"
  volumes:
    - name: postgres-data
      emptyDir: {}
  containers:
    - name: postgres
      image: postgres:13
      ports:
        - containerPort: 5432
      env:
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: admin
        - name: POSTGRES_DB
          value: basepfe3
      volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
    - name: microservice1
      image: nourbenali/myapplication-microservice1:latest
      ports:
        - containerPort: 9989
      env:
        - name: MINIKUBE_IP
          value: "192.168.49.2"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://localhost:5432/basepfe3"
        - name: SPRING_DATASOURCE_USERNAME
          value: "postgres"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "admin"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9093"
