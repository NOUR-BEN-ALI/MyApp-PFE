receivers:
  otlp:
    protocols:
      grpc:
      http:

processors:
  batch:

exporters:
  logging:
  loki:
    endpoint: http://loki:3100/loki/api/v1/push

service:
  pipelines:
    logs:  # Pipeline for log data
      receivers: [otlp]
      processors: [batch]
      exporters: [logging, loki]
