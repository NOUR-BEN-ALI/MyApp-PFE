version: '3'
services:
  prometheus:
    image: prom/prometheus:v2.46.0
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/test.yml
    volumes:
      - /var/jenkins_home/jobs/VisionaryOps/workspace@2/MyApp-PFE/docker/prometheus/test.yml:/etc/prometheus/test.yml:ro
    ports:
      - "9090:9090"
    networks:
      - my-network

networks:
  my-network:
