#    build: ./Microservice3
#    ports:
#      - "9987:9999"
#    depends_on:
#      - postgres
#      - kafka
#      - microservice1
#    environment:
#      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/basepfe5
#      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9093
#
#    networks:
#      - my-network

networks:
  my-network:

volumes:  # Définition des volumes
  postgres_data:
  prometheus_data:
  grafana_data:
  kafka_data:
  tempo-data:
