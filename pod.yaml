apiVersion: v1
kind: Pod
metadata:
  name: kafka-zookeeper-postgres-microservice1-pod
spec:
  initContainers:
    - name: init-zookeeper
      image: busybox
      command: ['sh', '-c', 'until nc -z zookeeper 2181; do sleep 1; done']
    - name: init-postgres
      image: busybox
      command: ['sh', '-c', 'until nc -z postgres 5432; do sleep 1; done']
  containers:
    - name: zookeeper
      image: wurstmeister/zookeeper:latest
      ports:
        - containerPort: 2181
      env:
        - name: ZOOKEEPER_TICK_TIME
          value: "2000"
    - name: postgres
      image: postgres:13
      ports:
        - containerPort: 5432
      env:
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          value: "admin"
        - name: POSTGRES_DB
          value: "basepfe3"
    - name: kafka
      image: wurstmeister/kafka:latest
      ports:
        - containerPort: 9093
      env:
        - name: KAFKA_BROKER_ID
          value: "1"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://kafka:9093,PLAINTEXT_HOST://localhost:9092"
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: "PLAINTEXT"
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: "zookeeper:2181"
        - name: KAFKA_LISTENERS
          value: "PLAINTEXT://kafka:9093,PLAINTEXT_HOST://0.0.0.0:9092"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
    - name: microservice1
      image: nourbenali/myapplication-microservice1:latest
      ports:
        - containerPort: 9997
      env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres:5432/basepfe3"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9093"
