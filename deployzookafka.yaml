apiVersion: v1
kind: Service
metadata:
  name: kafka-zookeeper-service
spec:
  ports:
    - name: kafka
      protocol: TCP
      port: 9093
      targetPort: 9093
    - name: zookeeper
      protocol: TCP
      port: 2181
      targetPort: 2181
  selector:
    # Select both Kafka and Zookeeper pods using labels
    app: kafka-zookeeper
---
apiVersion: v1
kind: Pod
metadata:
  name: zookeeper-kafka
spec:
  containers:
    - name: zookeeper
      image: wurstmeister/zookeeper:latest
      ports:
        - containerPort: 2181
      env:
        - name: ZOOKEEPER_TICK_TIME
          value: "2000"
      # You may need additional environment variables for Zookeeper configuration
    - name: kafka
      image: wurstmeister/kafka:latest
      ports:
        - containerPort: 9092
        - containerPort: 9093
      env:
        - name: KAFKA_BROKER_ID
          value: "1"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://localhost:9093"
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: "PLAINTEXT:PLAINTEXT"
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: "PLAINTEXT"
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: "localhost:2181"
        - name: KAFKA_LISTENERS
          value: "PLAINTEXT://0.0.0.0:9092"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
      # You may need additional environment variables for Kafka configuration
  # Define an init container to wait for Zookeeper to be ready before starting Kafka
  initContainers:
    - name: init-zookeeper
      image: busybox
      command: ['sh', '-c', 'until nc -z localhost 2181; do sleep 1; done;']