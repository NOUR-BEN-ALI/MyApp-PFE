apiVersion: v1
kind: Service
metadata:
  name: zookeeper-service
spec:
  selector:
    name: zookeeper
  ports:
    - protocol: TCP
      port: 2181
      targetPort: 2181

---

apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  selector:
    name: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432

---

apiVersion: v1
kind: Service
metadata:
  name: kafka-service
spec:
  selector:
    name: kafka
  ports:
    - protocol: TCP
      port: 9093
      targetPort: 9093

---

apiVersion: v1
kind: Service
metadata:
  name: microservice1-service
spec:
  selector:
    name: microservice1
  ports:
    - protocol: TCP
      port: 9997
      targetPort: 9997

---

apiVersion: v1
kind: Service
metadata:
  name: tempo-service
spec:
  selector:
    name: tempo
  ports:
    - name: tempo-port
      protocol: TCP
      port: 3200
      targetPort: 3200
    - name: otlp-grpc-port
      protocol: TCP
      port: 4327
      targetPort: 4327
    - name: otlp-http-port
      protocol: TCP
      port: 4328
      targetPort: 4328
